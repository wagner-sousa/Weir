installed:
- agent-context
- git
- lifecycle
- review
- switch
- verify
settings:
  auto_execute_hooks: true
hooks:
  before_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit outstanding changes before implementation?
    description: Auto-commit before implementation
    condition: null
  after_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit implementation changes?
    description: Auto-commit after implementation
    condition: null
  - extension: review
    command: speckit.review.run
    enabled: true
    optional: false
    priority: 10
    prompt: Run review after implementation?
    description: Review implementation changes
    condition: null
  - extension: verify
    command: speckit.verify.run
    enabled: true
    optional: false
    priority: 10
    prompt: Verify implementation against specification?
    description: Validate implementation against spec
    condition: null
  after_converge:
  - extension: lifecycle
    command: speckit.lifecycle.status
    enabled: true
    optional: false
    priority: 10
    prompt: Show lifecycle status after convergence?
    description: Report lifecycle status
    condition: null
  after_lifecycle_lock:
  - extension: lifecycle
    command: speckit.lifecycle.write-agents
    enabled: true
    optional: false
    priority: 10
    prompt: Update agent context with lifecycle lock rules?
    description: Write lifecycle lock rules to AGENTS.md
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: false
    priority: 10
    prompt: Commit lifecycle lock?
    description: Commit lifecycle lock and agent context
    condition: null
